name: Build and Release

on:
  push:
    branches:
      - master

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.find-plugins.outputs.plugins }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Find changed plugin directories
        id: find-plugins
        run: |
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            CHANGED=$(git diff --name-only HEAD~1 HEAD)
          else
            CHANGED=$(git diff-tree --no-commit-id -r --name-only HEAD)
          fi

          PLUGINS=$(echo "$CHANGED" \
            | grep -v '^\.github/' \
            | awk -F/ 'NF>1{print $1}' \
            | sort -u \
            | while read dir; do
                if [ -f "$dir/package.json" ]; then echo "$dir"; fi
              done \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')

          echo "plugins=${PLUGINS}" >> $GITHUB_OUTPUT
          echo "Changed plugins: ${PLUGINS}"

  build-and-release:
    needs: detect-changes
    if: needs.detect-changes.outputs.plugins != '[]' && needs.detect-changes.outputs.plugins != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        plugin: ${{ fromJson(needs.detect-changes.outputs.plugins) }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Install dependencies
        working-directory: ${{ matrix.plugin }}
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi

      - name: Build
        working-directory: ${{ matrix.plugin }}
        run: pnpm build

      - name: Generate version tag
        id: version
        run: |
          DATE=$(date -u +"%Y.%m.%d")
          SHORT_SHA=$(git rev-parse --short HEAD)
          TAG="${{ matrix.plugin }}@v${DATE}-dev+${SHORT_SHA}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: |
            Automated build of `${{ matrix.plugin }}` from commit [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
          files: ${{ matrix.plugin }}/dist/*
          make_latest: false
